name: Deliver starters

# Render every preset from the local template/ tree (the same renderer `aspect
# init` uses) and force-push each to its VitruvianSoftware/<preset> starter repo.
# Replaces the old hay-kot/scaffold flow; the starter set + deploy keys are
# unchanged (STARTER_DEPLOY_<PRESET> secrets, Pulumi-managed).
on:
  push:
    branches: [main, push_starters, platform-v2.0]

permissions:
  id-token: write
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BAZELISK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deliver:
    strategy:
      fail-fast: false
      matrix:
        preset:
          - cpp
          - go
          - java
          - js
          - kitchen-sink
          - kotlin
          - minimal
          - py
          - rust
          - swift
          - ruby
          - shell
          - scala
          - backstage-cpp
          - backstage-go
          - backstage-java
          - backstage-js
          - backstage-kitchen-sink
          - backstage-kotlin
          - backstage-minimal
          - backstage-py
          - backstage-ruby
          - backstage-rust
          - backstage-swift
          - backstage-scala
          - backstage-shell
    # The contended resource is each starter repo's `main`, which this job
    # force-pushes. Serialise deliveries per starter so two overlapping pushes
    # (a fix merge followed closely by its release PR) can never race, and the
    # older render can never land last. cancel-in-progress is false on purpose:
    # a push that is already running always finishes, so a starter is never left
    # half-delivered. While one is running, only the NEWEST waiting job is kept
    # (an older waiting one is cancelled), which is right because every render
    # is a full snapshot that supersedes the previous one. The group spans
    # branches deliberately: main, push_starters and platform-v2.0 all push to
    # the same starter repos.
    concurrency:
      group: deliver-${{ matrix.preset }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Aspect CLI
        uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}

      - name: Render + normalize + apply license headers
        id: render
        run: |
          aspect render-preset --preset='${{ matrix.preset }}' --out="$RUNNER_TEMP/out" --name=my_project --license=Apache-2.0
          cd "$RUNNER_TEMP/out"
          # Shared with ci.yaml so what CI checks is exactly what is shipped:
          # repin, buildifier, gazelle, licence headers, format, ruby layout fix.
          NORMALIZE_GIT_NAME="Git, the Delivery bot" NORMALIZE_GIT_EMAIL="git@nocentre.net" \
            "$GITHUB_WORKSPACE/.github/scripts/normalize-rendered.sh" '${{ matrix.preset }}'
          git config user.email "git@nocentre.net"
          git config user.name "Git, the Delivery bot"
          # Ship the platform CHANGELOG (maintained by release-please) so downstream
          # devs can track upstream changes.
          if [ -f "$GITHUB_WORKSPACE/CHANGELOG.md" ]; then cp "$GITHUB_WORKSPACE/CHANGELOG.md" CHANGELOG.md; fi
          git add -A
          git commit -q --amend --no-edit
          echo "dir=$PWD" >> "$GITHUB_OUTPUT"

      - name: Convert preset name to deploy secret name
        id: which-secret
        run: |
          CLEAN="${{ matrix.preset }}"
          CLEAN="${CLEAN//-/_}"
          echo "secret-name=STARTER_DEPLOY_${CLEAN^^}" >> "$GITHUB_OUTPUT"

      - name: Force-push to starter repo
        working-directory: ${{ steps.render.outputs.dir }}
        env:
          SSH_KEY: ${{ secrets[steps.which-secret.outputs.secret-name] }}
          SECRET_NAME: ${{ steps.which-secret.outputs.secret-name }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret $SECRET_NAME is missing or empty. Create it (Pulumi-managed deploy key) in GitHub Settings."
            exit 1
          fi
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$SSH_KEY"
          git push --force git@github.com:VitruvianSoftware/${{ matrix.preset }}.git HEAD:main
