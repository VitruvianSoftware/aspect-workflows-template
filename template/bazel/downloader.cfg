# Bazel downloader config — wired up via `--downloader_config` in .bazelrc.
# Use it to route downloads through a private/mirror host or to add fallback
# mirrors for flaky upstreams. See
# https://aspect.build/blog/configuring-bazels-downloader and
# https://bazel.build/reference/command-line-reference#flag--downloader_config
#
# Examples:
#   # Send all github.com downloads through an internal mirror first.
#   rewrite github.com/(.*) my-mirror.internal/github/$1
#   # Add a fallback mirror for a flaky host.
#   rewrite ftp.gnu.org/(.*) https://ftpmirror.gnu.org/$1
{% if rust %}

# rules_rs 0.0.90 fetches a zlib .deb for its Rust toolchain from
# archive.ubuntu.com / ports.ubuntu.com, which have since dropped that exact
# version (GET 404). Launchpad keeps every published version, and rules_rs still
# checks the pinned sha256, so this only changes where the same bytes come from.
# Drop these once rules_rs is bumped past 0.0.108 (which pins snapshot/Launchpad
# URLs itself) -- that bump is blocked until aspect_rules_lint_rust stops
# registering `@default_rust_toolchains//:all` (rules_rs 0.0.103+ removed it).
rewrite archive.ubuntu.com/ubuntu/pool/main/z/zlib/(zlib1g_[^/]+\.deb) launchpad.net/ubuntu/+archive/primary/+files/$1
rewrite ports.ubuntu.com/ubuntu-ports/pool/main/z/zlib/(zlib1g_[^/]+\.deb) launchpad.net/ubuntu/+archive/primary/+files/$1
{% endif %}
